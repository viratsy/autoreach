      # concurrent targets before the fan-out fix below; 28s gives the
      # handler room to return a clean response first.
      Timeout: 28
      Environment:
        Variables:
          META_APP_ID: !Ref MetaAppId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
