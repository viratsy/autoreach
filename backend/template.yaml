  WorkshopNightlyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/workshops/nightly-scheduler.handler
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          MASTERCLASS_TABLE: "masterclass_lookup_key"
          WORKSHOP_DB_TABLE: "WhatsAppDatabase"
          # These three were previously unset — the handler read
          # process.env.WORKSHOP_CONFIG_TABLE/BUSINESSES_TABLE with a
          # hardcoded "-hardik"-suffixed fallback and no IAM grant at all,
          # so on navin (and even on hardik, since nothing granted access)
          # every config/business lookup here would fail.
          WORKSHOP_CONFIG_TABLE: !Sub "autoreach-workshop-config-${EnvName}"
          BUSINESSES_TABLE: !Ref BusinessesTable
          TEMPLATES_TABLE: !Ref TemplatesTable
          MENTOR_NAME: !Ref MentorName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-reengagement-${EnvName}"
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/masterclass_lookup_key"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhatsAppDatabase"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/autoreach-workshop-config-${EnvName}"
                - !GetAtt BusinessesTable.Arn
                - !GetAtt TemplatesTable.Arn
      Events:
        NightlySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 19 * * ? *)
            Description: "Workshop re-engagement nightly at 1 AM IST"

  NumberRotationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/number-rotation.handler
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          ROTATION_TARGET_FUNCTION: "free_workshop_meta"
          # Both accounts' signup flows run on RED numbers only.
          SIGNUP_POOL_QUALITIES: "RED"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBReadPolicy:
            TableName: !Ref TemplatesTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - lambda:GetFunctionConfiguration
                - lambda:UpdateFunctionConfiguration
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:free_workshop_meta"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            # 9:00 AM IST — 30 min after DailySyncFunction's template sync, so a
            # template approved overnight is already recorded before numbers are
            # tested for eligibility.
            Schedule: cron(30 3 * * ? *)
            Description: "Rotate free_workshop_meta sender pool by number quality at 9 AM IST"

  # Projects the signup confirmations free_workshop_meta logs in comm_messages
  # into read-only "<date>_<workshop>_signup" campaigns so their delivery stats
  # show in the campaigns list. comm_messages is outside this stack.
  SignupCampaignSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/workshops/signup-campaign-sync.handler
      Timeout: 300
      MemorySize: 512
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          COMM_TABLE: comm_messages
          WORKSHOP_REGISTRY_TABLE: !Sub "autoreach-workshop-registry-${EnvName}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBReadPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBReadPolicy:
            TableName: !Sub "autoreach-workshop-registry-${EnvName}"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/comm_messages/index/*"
      Events:
        Every10Minutes:
          Type: Schedule
          Properties:
            Schedule: rate(10 minutes)
            Description: "Refresh signup-message campaigns from comm_messages"

  CrossaleBatchesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/crossale/batches.handler
      Timeout: 28
      MemorySize: 512
      Environment:
        Variables:
          DATABASE_TABLE: "database"
          WORKSHOP_REGISTRY_TABLE: !Sub "autoreach-workshop-registry-${EnvName}"
      Policies:
        - DynamoDBReadPolicy:
            TableName: "database"
        - DynamoDBReadPolicy:
            TableName: !Sub "autoreach-workshop-registry-${EnvName}"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /crossale/batches
            Method: GET

  CrossaleLeadsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/crossale/leads.handler
      Timeout: 28
      MemorySize: 512
      Environment:
        Variables:
          DATABASE_TABLE: "database"
          WORKSHOP_REGISTRY_TABLE: !Sub "autoreach-workshop-registry-${EnvName}"
          MASTERCLASS_TABLE: "masterclass_lookup_key"
      Policies:
        - DynamoDBReadPolicy:
            TableName: "database"
        - DynamoDBReadPolicy:
            TableName: !Sub "autoreach-workshop-registry-${EnvName}"
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:BatchGetItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/masterclass_lookup_key"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /crossale/leads
            Method: POST

  CrossaleCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/crossale/create.handler
      Timeout: 28
      MemorySize: 512
      Environment:
        Variables:
          DATABASE_TABLE: "database"
          WORKSHOP_REGISTRY_TABLE: !Sub "autoreach-workshop-registry-${EnvName}"
          WORKSHOP_CONFIG_TABLE: !Sub "autoreach-workshop-config-${EnvName}"
          CSV_BUCKET: !Ref CSVBucket
          SEND_FUNCTION_ARN: !GetAtt SendCampaignFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
          SCHEDULER_GROUP: !Sub "autoreach-${EnvName}"
          MENTOR_NAME: !Ref MentorName
      Policies:
        - DynamoDBReadPolicy:
            TableName: "database"
        - DynamoDBReadPolicy:
            TableName: !Sub "autoreach-workshop-registry-${EnvName}"
        - DynamoDBReadPolicy:
            TableName: !Sub "autoreach-workshop-config-${EnvName}"
        - DynamoDBReadPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBReadPolicy:
            TableName: !Ref TemplatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - S3CrudPolicy:
            BucketName: !Ref CSVBucket
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
              Resource:
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/autoreach-${EnvName}/*"
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /crossale/create
            Method: POST

  CurrentBatchSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/workshops/current-batch-scheduler.handler
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          DATABASE_TABLE: "database"
          WHATSAPP_DATABASE_TABLE: "WhatsAppDatabase"
          WORKSHOP_REGISTRY_TABLE: !Sub "autoreach-workshop-registry-${EnvName}"
          WORKSHOP_CONFIG_TABLE: !Sub "autoreach-workshop-config-${EnvName}"
          CSV_BUCKET: !Ref CSVBucket
          MENTOR_NAME: !Ref MentorName
          NOTIFICATIONS_TABLE: !Sub "autoreach-notifications-${EnvName}"
          # Campaigns that pass pre-flight are created already scheduled, which
          # means this function now creates EventBridge schedules too — exactly
          # as CrossaleCreateFunction does.
          SEND_FUNCTION_ARN: !GetAtt SendCampaignFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
          SCHEDULER_GROUP: !Sub "autoreach-${EnvName}"
          # Email rides along whenever a library template claims the run key.
          EMAIL_LIBRARY_TABLE: !Ref EmailLibraryTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EmailLibraryTable
        - DynamoDBReadPolicy:
            TableName: "database"
        - DynamoDBReadPolicy:
            TableName: "WhatsAppDatabase"
        - DynamoDBReadPolicy:
            TableName: !Sub "autoreach-workshop-registry-${EnvName}"
        - DynamoDBReadPolicy:
            TableName: !Sub "autoreach-workshop-config-${EnvName}"
        - DynamoDBReadPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBReadPolicy:
            TableName: !Ref TemplatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - S3CrudPolicy:
            BucketName: !Ref CSVBucket
        # Pre-flight failures are surfaced as notifications rather than only logged.
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-notifications-${EnvName}"
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
              Resource:
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/autoreach-${EnvName}/*"
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
      Events:
        NightlySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(30 minutes)
            Description: "Current-batch: auto-schedule due campaigns that pass pre-flight, hold the rest as drafts, and top up existing ones with new registrants"

  MetaWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/webhooks/meta-status.handler
      Environment:
        Variables:
          WEBHOOK_QUEUE_URL: !Ref WebhookQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt WebhookQueue.QueueName
      Events:
        WebhookGet:
          Type: Api
          Properties:
            Path: /webhooks/meta
            Method: GET
        WebhookPost:
          Type: Api
          Properties:
            Path: /webhooks/meta
            Method: POST

  WebhookWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/webhooks/webhook-worker.handler
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          FLOWS_TABLE: !Ref FlowsTable
          FLOW_INSTANCES_TABLE: !Ref FlowInstancesTable
          CONVERSATIONS_TABLE: !Ref ConversationsTable
          UNSUBSCRIBE_TABLE: !Sub "autoreach-unsubscribe-${EnvName}"
          COMM_TABLE: comm_messages
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PhoneLookupTable
        # comm_messages lives outside this stack (owned by free_workshop_meta);
        # only the signup-row status updates are needed here.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/comm_messages"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/comm_messages/index/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowInstancesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-unsubscribe-${EnvName}"
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt WebhookQueue.Arn
            BatchSize: 10

  NotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/notifications/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-notifications-${EnvName}"
      Environment:
        Variables:
          NOTIFICATIONS_TABLE: !Sub "autoreach-notifications-${EnvName}"
      Events:
        GetApi:
          Type: Api
          Properties:
            Path: /notifications
            Method: GET
        DeleteApi:
          Type: Api
          Properties:
            Path: /notifications
            Method: DELETE

  # --- Automation Flows ---
  FlowsCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/flows/crud.handler
      Environment:
        Variables:
          FLOWS_TABLE: !Ref FlowsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowsTable
      Events:
        ListApi:
          Type: Api
          Properties:
            Path: /flows
            Method: GET
        CreateApi:
          Type: Api
          Properties:
            Path: /flows
            Method: POST
        GetApi:
          Type: Api
          Properties:
            Path: /flows/{flowId}
            Method: GET
        UpdateApi:
          Type: Api
          Properties:
            Path: /flows/{flowId}
            Method: PUT
        DeleteApi:
          Type: Api
          Properties:
            Path: /flows/{flowId}
            Method: DELETE
        ToggleApi:
          Type: Api
          Properties:
            Path: /flows/{flowId}/toggle
            Method: POST

  FlowConversationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/flows/conversations.handler
      Environment:
        Variables:
          CONVERSATIONS_TABLE: !Ref ConversationsTable
          FLOW_INSTANCES_TABLE: !Ref FlowInstancesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowInstancesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        GetChat:
          Type: Api
          Properties:
            Path: /conversations
            Method: GET
        ListChats:
          Type: Api
          Properties:
            Path: /conversations/list
            Method: GET
        SendChat:
          Type: Api
          Properties:
            Path: /conversations/send
            Method: POST
        FlowInstances:
          Type: Api
          Properties:
            Path: /flows/{flowId}/instances
            Method: GET

  FlowSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/flows/scheduler.handler
      Timeout: 120
      Environment:
        Variables:
          FLOWS_TABLE: !Ref FlowsTable
          FLOW_INSTANCES_TABLE: !Ref FlowInstancesTable
          CONVERSATIONS_TABLE: !Ref ConversationsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowInstancesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Description: "Check for expired flow waits and retrigger"

  FlowTestApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/flows/test-api.handler
      Timeout: 30
      Events:
        Api:
          Type: Api
          Properties:
            Path: /flows/test-api
            Method: POST

  # --- AWS billing attribution ---
  # Splits the AWS bill into AutoReach's share and everything else's. Reads
  # usage metrics rather than cost allocation tags, because tags are not applied
  # retroactively and so can never explain a past month.
  BillingComputeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "autoreach-billing-compute-${EnvName}"
      Handler: dist/handlers/billing/compute.handler
      # Reads ~500 CloudWatch metrics plus a DescribeTable per table, so it runs
      # far longer than an API-fronted function is allowed to.
      Timeout: 600
      MemorySize: 1024
      Environment:
        Variables:
          BILLING_TABLE: !Ref BillingTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BillingTable
        - Version: "2012-10-17"
          Statement:
            # All read-only: cost figures plus the usage metrics and resource
            # inventories needed to apportion them.
            - Effect: Allow
              Action:
                - ce:GetCostAndUsage
                - cloudwatch:GetMetricData
                - dynamodb:ListTables
                - dynamodb:DescribeTable
                - lambda:ListFunctions
                - apigateway:GET
                - sqs:ListQueues
                - logs:DescribeLogGroups
                - s3:ListAllMyBuckets
              Resource: "*"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            # 07:00 IST daily. Keeps the open month current, and on the 1st to
            # 5th also settles the month that just ended (see compute.ts).
            Schedule: cron(30 1 * * ? *)
            Description: "Recompute AutoReach's AWS cost share at 7 AM IST"

  BillingGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/billing/get.handler
      Timeout: 28
      Environment:
        Variables:
          BILLING_TABLE: !Ref BillingTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BillingTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /billing
            Method: GET

  BillingRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/billing/refresh.handler
      Timeout: 28
      Environment:
        Variables:
          BILLING_TABLE: !Ref BillingTable
          BILLING_COMPUTE_FUNCTION: !Ref BillingComputeFunction
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BillingTable
        - LambdaInvokePolicy:
            FunctionName: !Ref BillingComputeFunction
      Events:
        Api:
          Type: Api
          Properties:
            Path: /billing/refresh
            Method: POST

  # --- Email (rides along with each WhatsApp campaign) ---
  EmailWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/email-worker.handler
      # Paces itself to the SES send rate, so a 100-contact batch can run for
      # well over a minute; must stay under EmailQueue's VisibilityTimeout.
      Timeout: 900
      MemorySize: 512
      # The pacing below is per invocation, and SQS scales this function out to
      # ~5 concurrent batches the moment a campaign queues. Five workers each
      # pacing to SesSendRate is five times the account's SES rate limit, and
      # everything over it comes back as TooManyRequestsException — counted as
      # a failed email and never retried. Capping at one invocation is what
      # makes SesSendRate mean the account-wide rate it claims to.
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          EMAIL_LIBRARY_TABLE: !Ref EmailLibraryTable
          EMAIL_SUPPRESSION_TABLE: !Ref EmailSuppressionTable
          REMINDER_FROM_EMAIL: !Ref ReminderFromEmail
          LINK_BASE_URL: !Ref LinkBaseUrl
          SES_CONFIGURATION_SET: !Sub "autoreach-${EnvName}"
          SES_SEND_RATE: !Ref SesSendRate
          ENV_NAME: !Ref EnvName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EmailLibraryTable
        - DynamoDBReadPolicy:
            TableName: !Ref EmailSuppressionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        # Per-recipient email rows live beside the WhatsApp message rows.
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
      Events:
        EmailQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt EmailQueue.Arn
            BatchSize: 1

  UnsubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/links/unsubscribe-redirect.handler
      Timeout: 10
      Environment:
        Variables:
          EMAIL_SUPPRESSION_TABLE: !Ref EmailSuppressionTable
          ENV_NAME: !Ref EnvName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmailSuppressionTable
      Events:
        # Public on purpose, and unauthenticated by design: bulk-sender rules
        # require unsubscribe to work in one click with no login. The token is
        # HMAC-signed so it can't be used to unsubscribe someone else.
        GetApi:
          Type: Api
          Properties:
            Path: /u/{token}
            Method: GET
        # Gmail/Yahoo one-click (List-Unsubscribe-Post).
        PostApi:
          Type: Api
          Properties:
            Path: /u/{token}
            Method: POST

  SesNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/webhooks/ses-notifications.handler
      Timeout: 30
      Environment:
        Variables:
          EMAIL_SUPPRESSION_TABLE: !Ref EmailSuppressionTable
          ENV_NAME: !Ref EnvName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmailSuppressionTable
        # Open/click/bounce/complaint events increment counters on the
        # campaign's STATS item, so this needs the campaigns table too.
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        # Stamps delivery/open/click/bounce onto the per-recipient email rows.
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
      Events:
        SnsEvent:
          Type: SNS
          Properties:
            Topic: !Ref SesNotificationsTopic

  TestEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/test-email.handler
      Timeout: 28
      Environment:
        Variables:
          EMAIL_LIBRARY_TABLE: !Ref EmailLibraryTable
          EMAIL_SUPPRESSION_TABLE: !Ref EmailSuppressionTable
          REMINDER_FROM_EMAIL: !Ref ReminderFromEmail
          LINK_BASE_URL: !Ref LinkBaseUrl
          SES_CONFIGURATION_SET: !Sub "autoreach-${EnvName}"
          ENV_NAME: !Ref EnvName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EmailLibraryTable
        - DynamoDBReadPolicy:
            TableName: !Ref CampaignsTable
        - S3ReadPolicy:
            BucketName: !Ref CSVBucket
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/{campaignId}/test-email
            Method: POST
        # Same handler, no campaign: the wizard tests the email on the Test
        # Message step, before the campaign has been created.
        DraftApi:
          Type: Api
          Properties:
            Path: /campaigns/test-email
            Method: POST

  EmailTemplatesApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/email-templates-api.handler
      Timeout: 28
      Environment:
        Variables:
          EMAIL_LIBRARY_TABLE: !Ref EmailLibraryTable
          ENV_NAME: !Ref EnvName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmailLibraryTable
      Events:
        GetApi:
          Type: Api
          Properties:
            Path: /email-templates
            Method: GET
        PutApi:
          Type: Api
          Properties:
            Path: /email-templates
            Method: PUT
        DeleteApi:
          Type: Api
          Properties:
            Path: /email-templates
            Method: DELETE

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  WebhookUrl:
    Description: Meta Webhook URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/webhooks/meta"

