AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AutoReach - WhatsApp Campaign Scheduler Backend v9

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Layers:
      - !Ref DependenciesLayer
    Environment:
      Variables:
        BUSINESSES_TABLE: !Ref BusinessesTable
        CAMPAIGNS_TABLE: !Ref CampaignsTable
        MESSAGES_TABLE: !Ref MessagesTable
        TEMPLATES_TABLE: !Ref TemplatesTable
        CSV_BUCKET: !Ref CSVBucket
        META_ACCESS_TOKEN: !Ref MetaAccessToken
        WEBHOOK_VERIFY_TOKEN: !Ref WebhookVerifyToken
        BUILD_VERSION: "v10"
        SES_FROM_EMAIL: !Ref SesFromEmail
        OTP_TABLE: !Ref OTPTable
        REENGAGEMENT_TABLE: !Sub "autoreach-reengagement-${EnvName}"
        FLOWS_TABLE: !Ref FlowsTable
        FLOW_INSTANCES_TABLE: !Ref FlowInstancesTable
        CONVERSATIONS_TABLE: !Ref ConversationsTable
        JWT_SECRET: !Ref WebhookVerifyToken
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"
      AllowCredentials: false

Parameters:
  MetaAccessToken:
    Type: String
    NoEcho: true
  WebhookVerifyToken:
    Type: String
    NoEcho: true
  EnvName:
    Type: String
    Default: "dev"
    Description: "Environment name (hardik/navin)"
  SesFromEmail:
    Type: String
    Default: "otp@hardikraja.com"
    Description: "SES verified sender email for OTP"
  MetaAppId:
    Type: String
    Default: ""
    Description: "Meta App ID for resumable uploads"

Resources:
  # --- Lambda Layer ---
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "autoreach-deps-${EnvName}"
      ContentUri: layers/dependencies/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: nodejs22.x

  # --- DynamoDB Tables ---
  BusinessesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: autoreach-businesses
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  CampaignsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: autoreach-campaigns
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: autoreach-messages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: autoreach-templates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  OTPTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-otp-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  FlowsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-flows-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  FlowInstancesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-flow-instances-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-conversations-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # --- SQS ---
  SendQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "autoreach-send-${EnvName}"
      VisibilityTimeout: 360
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SendDLQ.Arn
        maxReceiveCount: 2

  SendDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "autoreach-send-dlq-${EnvName}"
      MessageRetentionPeriod: 604800

  WebhookQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "autoreach-webhook-${EnvName}"
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WebhookDLQ.Arn
        maxReceiveCount: 3

  WebhookDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "autoreach-webhook-dlq-${EnvName}"
      MessageRetentionPeriod: 604800

  # --- S3 ---
  CSVBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "autoreach-csv-${EnvName}-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: AutoDelete30Days
            Status: Enabled
            ExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT]
            AllowedOrigins:
              - "https://autoreach.hardikraja.com"
              - "https://autoreach.navinparmar.in"
              - "http://localhost:3000"
            ExposedHeaders: [ETag]
            MaxAge: 300

  CSVBucketCDN:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt CSVBucket.RegionalDomainName
            OriginAccessControlId: !Ref CSVBucketOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
          Compress: true
          DefaultTTL: 86400
        PriceClass: PriceClass_100

  CSVBucketOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "autoreach-csv-oac-${EnvName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CSVBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CSVBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${CSVBucket.Arn}/images/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CSVBucketCDN}"

  # --- IAM Role for EventBridge Scheduler ---
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "autoreach-scheduler-role-${EnvName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSendLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SendCampaignFunction.Arn

  # --- Lambda Functions ---
  RequestOTPFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/auth/request-otp.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OTPTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/request-otp
            Method: POST

  VerifyOTPFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/auth/verify-otp.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OTPTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/verify-otp
            Method: POST

  ListBusinessesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/list.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /businesses
            Method: GET

  CreateBusinessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /businesses
            Method: POST

  UpdateBusinessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/update.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /businesses/{businessId}
            Method: PUT

  SubscribeWebhooksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/subscribe-webhooks.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /businesses/subscribe-webhooks
            Method: POST

  QualityCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/quality-check.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /businesses/quality-check
            Method: POST

  CreateCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
              Resource:
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/autoreach-${EnvName}/*"
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
      Environment:
        Variables:
          SEND_FUNCTION_ARN: !GetAtt SendCampaignFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
          SCHEDULER_GROUP: !Sub "autoreach-${EnvName}"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns
            Method: POST

  ListCampaignsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/list.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns
            Method: GET

  GetCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/get.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/{campaignId}
            Method: GET

  DuplicateCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/duplicate.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/{campaignId}/duplicate
            Method: POST

  CancelCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/cancel.handler
      Environment:
        Variables:
          SCHEDULER_GROUP: !Sub "autoreach-${EnvName}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - scheduler:DeleteSchedule
              Resource:
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/autoreach-${EnvName}/*"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/{campaignId}/cancel
            Method: POST

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/upload-url.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref CSVBucket
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/upload-url
            Method: POST

  ListFilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/list-files.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref CSVBucket
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/files
            Method: GET

  FilePreviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/file-preview.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref CSVBucket
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/file-preview
            Method: GET

  UploadImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/upload-image.handler
      Environment:
        Variables:
          CDN_URL: !Sub "https://${CSVBucketCDN.DomainName}"
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref CSVBucket
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/upload-image
            Method: POST

  ListImagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/list-images.handler
      Environment:
        Variables:
          CDN_URL: !Sub "https://${CSVBucketCDN.DomainName}"
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref CSVBucket
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/images
            Method: GET

  TestSendFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/test-send.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/test-send
            Method: POST

  SendCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/send.handler
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          SEND_QUEUE_URL: !Ref SendQueue
          STAGGER_MINUTES: "1"
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref CSVBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SendQueue.QueueName

  SendWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/send-worker.handler
      Timeout: 300
      MemorySize: 256
      ReservedConcurrentExecutions: 50
      Environment:
        Variables:
          RETRY_FUNCTION_NAME: !Ref RetryFailedFunction
          RESUME_FUNCTION_NAME: !Ref ResumeCampaignFunction
          NOTIFICATIONS_TABLE: !Sub "autoreach-notifications-${EnvName}"
          UNSUBSCRIBE_TABLE: !Sub "autoreach-unsubscribe-${EnvName}"
          MSGS_PER_SECOND: "1.5"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TemplatesTable
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-notifications-${EnvName}"
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-unsubscribe-${EnvName}"
        - LambdaInvokePolicy:
            FunctionName: !Ref RetryFailedFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ResumeCampaignFunction
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt SendQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  RetryFailedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/retry-failed.handler
      Timeout: 120
      Environment:
        Variables:
          SEND_QUEUE_URL: !Ref SendQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SendQueue.QueueName
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/{campaignId}/retry
            Method: POST

  AutoStopCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/auto-stop.handler
      Timeout: 60
      Environment:
        Variables:
          NOTIFICATIONS_TABLE: !Sub "autoreach-notifications-${EnvName}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-notifications-${EnvName}"
      Events:
        NightlySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 19 * * ? *)
            Description: "Auto-stop campaigns still running from a previous day, 1 AM IST"

  ResumeCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/resume.handler
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          SEND_QUEUE_URL: !Ref SendQueue
          RETRY_FUNCTION_NAME: !Ref RetryFailedFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SendQueue.QueueName
        - LambdaInvokePolicy:
            FunctionName: !Ref RetryFailedFunction
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/{campaignId}/resume
            Method: POST

  RescheduleCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/reschedule.handler
      Timeout: 30
      Environment:
        Variables:
          SCHEDULER_GROUP: !Sub "autoreach-${EnvName}"
          SEND_FUNCTION_ARN: !GetAtt SendCampaignFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - scheduler:DeleteSchedule
                - scheduler:CreateSchedule
              Resource:
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/autoreach-${EnvName}/*"
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/{campaignId}/reschedule
            Method: PUT

  FetchTemplatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/templates/fetch.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TemplatesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /templates/fetch
            Method: POST

  ListTemplatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/templates/list.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TemplatesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /templates
            Method: GET

  ManualAddTemplateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/templates/manual-add.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TemplatesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /templates/manual
            Method: POST

  CreateTemplateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/templates/create.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TemplatesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /templates/create
            Method: POST

  CopyTemplateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/templates/copy.handler
      Timeout: 60
      Environment:
        Variables:
          META_APP_ID: !Ref MetaAppId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TemplatesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /templates/copy
            Method: POST

  DailySyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/templates/daily-sync.handler
      Timeout: 300
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TemplatesTable
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 3 * * ? *)
            Description: "Daily template sync at 8:30 AM IST"

  WorkshopRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/workshops/register.handler
      Environment:
        Variables:
          WORKSHOP_REGISTRY_TABLE: !Sub "autoreach-workshop-registry-${EnvName}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-reengagement-${EnvName}"
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-workshop-registry-${EnvName}"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /workshops/register
            Method: POST

  WorkshopBulkRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/workshops/bulk-register.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-reengagement-${EnvName}"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /workshops/bulk-register
            Method: POST

  WorkshopContactsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/workshops/list-contacts.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-reengagement-${EnvName}"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /workshops/contacts
            Method: GET

  WorkshopStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/workshops/stats.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-reengagement-${EnvName}"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /workshops/stats
            Method: GET

  WorkshopRegistryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/workshops/registry.handler
      Environment:
        Variables:
          WORKSHOP_REGISTRY_TABLE: !Sub "autoreach-workshop-registry-${EnvName}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-workshop-registry-${EnvName}"
      Events:
        GetApi:
          Type: Api
          Properties:
            Path: /workshops/registry
            Method: GET
        PutApi:
          Type: Api
          Properties:
            Path: /workshops/registry
            Method: PUT
        DeleteApi:
          Type: Api
          Properties:
            Path: /workshops/registry
            Method: DELETE

  WorkshopConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/workshops/config.handler
      Environment:
        Variables:
          WORKSHOP_CONFIG_TABLE: !Sub "autoreach-workshop-config-${EnvName}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-workshop-config-${EnvName}"
      Events:
        GetApi:
          Type: Api
          Properties:
            Path: /workshops/config
            Method: GET
        PutApi:
          Type: Api
          Properties:
            Path: /workshops/config
            Method: PUT
        ListApi:
          Type: Api
          Properties:
            Path: /workshops/config/list
            Method: GET

  WorkshopDownloadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/workshops/download.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-reengagement-${EnvName}"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /workshops/download
            Method: GET

  WorkshopNightlyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/workshops/nightly-scheduler.handler
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          MASTERCLASS_TABLE: "masterclass_lookup_key"
          WORKSHOP_DB_TABLE: "WhatsAppDatabase"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-reengagement-${EnvName}"
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/masterclass_lookup_key"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WhatsAppDatabase"
      Events:
        NightlySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 19 * * ? *)
            Description: "Workshop re-engagement nightly at 1 AM IST"

  MetaWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/webhooks/meta-status.handler
      Environment:
        Variables:
          WEBHOOK_QUEUE_URL: !Ref WebhookQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt WebhookQueue.QueueName
      Events:
        WebhookGet:
          Type: Api
          Properties:
            Path: /webhooks/meta
            Method: GET
        WebhookPost:
          Type: Api
          Properties:
            Path: /webhooks/meta
            Method: POST

  WebhookWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/webhooks/webhook-worker.handler
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          FLOWS_TABLE: !Ref FlowsTable
          FLOW_INSTANCES_TABLE: !Ref FlowInstancesTable
          CONVERSATIONS_TABLE: !Ref ConversationsTable
          UNSUBSCRIBE_TABLE: !Sub "autoreach-unsubscribe-${EnvName}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowInstancesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-unsubscribe-${EnvName}"
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt WebhookQueue.Arn
            BatchSize: 10

  NotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/notifications/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "autoreach-notifications-${EnvName}"
      Environment:
        Variables:
          NOTIFICATIONS_TABLE: !Sub "autoreach-notifications-${EnvName}"
      Events:
        GetApi:
          Type: Api
          Properties:
            Path: /notifications
            Method: GET
        DeleteApi:
          Type: Api
          Properties:
            Path: /notifications
            Method: DELETE

  # --- Automation Flows ---
  FlowsCrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/flows/crud.handler
      Environment:
        Variables:
          FLOWS_TABLE: !Ref FlowsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowsTable
      Events:
        ListApi:
          Type: Api
          Properties:
            Path: /flows
            Method: GET
        CreateApi:
          Type: Api
          Properties:
            Path: /flows
            Method: POST
        GetApi:
          Type: Api
          Properties:
            Path: /flows/{flowId}
            Method: GET
        UpdateApi:
          Type: Api
          Properties:
            Path: /flows/{flowId}
            Method: PUT
        DeleteApi:
          Type: Api
          Properties:
            Path: /flows/{flowId}
            Method: DELETE
        ToggleApi:
          Type: Api
          Properties:
            Path: /flows/{flowId}/toggle
            Method: POST

  FlowConversationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/flows/conversations.handler
      Environment:
        Variables:
          CONVERSATIONS_TABLE: !Ref ConversationsTable
          FLOW_INSTANCES_TABLE: !Ref FlowInstancesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowInstancesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        GetChat:
          Type: Api
          Properties:
            Path: /conversations
            Method: GET
        ListChats:
          Type: Api
          Properties:
            Path: /conversations/list
            Method: GET
        SendChat:
          Type: Api
          Properties:
            Path: /conversations/send
            Method: POST
        FlowInstances:
          Type: Api
          Properties:
            Path: /flows/{flowId}/instances
            Method: GET

  FlowSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/flows/scheduler.handler
      Timeout: 120
      Environment:
        Variables:
          FLOWS_TABLE: !Ref FlowsTable
          FLOW_INSTANCES_TABLE: !Ref FlowInstancesTable
          CONVERSATIONS_TABLE: !Ref ConversationsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowInstancesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Description: "Check for expired flow waits and retrigger"

  FlowTestApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/flows/test-api.handler
      Timeout: 30
      Events:
        Api:
          Type: Api
          Properties:
            Path: /flows/test-api
            Method: POST

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  WebhookUrl:
    Description: Meta Webhook URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/webhooks/meta"

