AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AutoReach - WhatsApp Campaign Scheduler Backend v2

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        BUSINESSES_TABLE: !Ref BusinessesTable
        CAMPAIGNS_TABLE: !Ref CampaignsTable
        MESSAGES_TABLE: !Ref MessagesTable
        TEMPLATES_TABLE: !Ref TemplatesTable
        CSV_BUCKET: !Ref CSVBucket
        META_ACCESS_TOKEN: !Ref MetaAccessToken
        WEBHOOK_VERIFY_TOKEN: !Ref WebhookVerifyToken
        SES_FROM_EMAIL: !Ref SesFromEmail
        OTP_TABLE: !Ref OTPTable
        JWT_SECRET: !Ref WebhookVerifyToken
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'https://autoreach.hardikraja.com'"
      AllowCredentials: true

Parameters:
  MetaAccessToken:
    Type: String
    NoEcho: true
  WebhookVerifyToken:
    Type: String
    NoEcho: true
  EnvName:
    Type: String
    Default: "dev"
    Description: "Environment name (hardik/navin)"
  SesFromEmail:
    Type: String
    Default: "otp@hardikraja.com"
    Description: "SES verified sender email for OTP"

Resources:
  # --- DynamoDB Tables ---
  BusinessesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: autoreach-businesses
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  CampaignsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: autoreach-campaigns
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: autoreach-messages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: autoreach-templates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  OTPTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-otp-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # --- S3 ---
  CSVBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "autoreach-csv-${EnvName}-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT]
            AllowedOrigins:
              - "https://autoreach.hardikraja.com"
              - "https://autoreach.navinparmar.in"
              - "http://localhost:3000"
            ExposedHeaders: [ETag]
            MaxAge: 300

  # --- IAM Role for EventBridge Scheduler ---
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "autoreach-scheduler-role-${EnvName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSendLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SendCampaignFunction.Arn

  # --- Lambda Functions ---
  RequestOTPFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/auth/request-otp.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OTPTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/request-otp
            Method: POST

  VerifyOTPFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/auth/verify-otp.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OTPTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/verify-otp
            Method: POST

  ListBusinessesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/list.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /businesses
            Method: GET

  CreateCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
              Resource:
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/autoreach-${EnvName}/*"
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
      Environment:
        Variables:
          SEND_FUNCTION_ARN: !GetAtt SendCampaignFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
          SCHEDULER_GROUP: !Sub "autoreach-${EnvName}"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns
            Method: POST

  ListCampaignsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/list.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns
            Method: GET

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/upload-url.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref CSVBucket
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/upload-url
            Method: POST

  ListFilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/list-files.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref CSVBucket
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/files
            Method: GET

  FilePreviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/file-preview.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref CSVBucket
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/file-preview
            Method: GET

  TestSendFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/test-send.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/test-send
            Method: POST

  SendCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/send.handler
      Timeout: 900
      MemorySize: 512
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref CSVBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable

  FetchTemplatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/templates/fetch.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TemplatesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /templates/fetch
            Method: POST

  ListTemplatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/templates/list.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TemplatesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /templates
            Method: GET

  MetaWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/webhooks/meta-status.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
      Events:
        WebhookGet:
          Type: Api
          Properties:
            Path: /webhooks/meta
            Method: GET
        WebhookPost:
          Type: Api
          Properties:
            Path: /webhooks/meta
            Method: POST

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  WebhookUrl:
    Description: Meta Webhook URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/webhooks/meta"
