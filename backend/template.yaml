  FetchTemplatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/templates/fetch.handler
      # API Gateway REST APIs hard-kill the connection at 29s regardless of
      # this value — set just under it so the Lambda itself returns a clean
      # error/completes before that happens, instead of silently continuing
      # in the background past when the caller already gave up (which is
      # exactly what made some numbers' template rows never get written).
      Timeout: 28
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TemplatesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /templates/fetch
            Method: POST

