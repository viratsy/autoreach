AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AutoReach - WhatsApp Campaign Scheduler Backend v9

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Layers:
      - !Ref DependenciesLayer
    Environment:
      Variables:
        BUSINESSES_TABLE: !Ref BusinessesTable
        CAMPAIGNS_TABLE: !Ref CampaignsTable
        MESSAGES_TABLE: !Ref MessagesTable
        TEMPLATES_TABLE: !Ref TemplatesTable
        CSV_BUCKET: !Ref CSVBucket
        META_ACCESS_TOKEN: !Ref MetaAccessToken
        # Meta's hub.verify_token, checked only during the webhook subscribe handshake
        # (handlers/webhooks/meta-status.ts). Nothing else reads it, so rotating it does
        # not interrupt delivery - but the new value has to be pasted into the Meta app's
        # webhook config before anyone re-subscribes, or verification will fail there.
        WEBHOOK_VERIFY_TOKEN: '{{resolve:secretsmanager:autoreach/webhook-verify-token:SecretString:token}}'
        BUILD_VERSION: "v10"
        SES_FROM_EMAIL: !Ref SesFromEmail
        OTP_TABLE: !Ref OTPTable
        REENGAGEMENT_TABLE: !Sub "autoreach-reengagement-${EnvName}"
        FLOWS_TABLE: !Ref FlowsTable
        FLOW_INSTANCES_TABLE: !Ref FlowInstancesTable
        CONVERSATIONS_TABLE: !Ref ConversationsTable
        # Its own secret now. It used to be the same value as WEBHOOK_VERIFY_TOKEN, which
        # meant one string in a committed file was both the webhook token and the key that
        # signs every login - and anyone who could read the repo could mint a token for any
        # allowed email. They are unrelated jobs and rotate on different schedules.
        #
        # Rotating this one is not free: it signs 7-day login tokens (lib/jwt.ts) AND the
        # unsubscribe links embedded in mail already sent (lib/email-suppression.ts). A new
        # value logs everyone out and makes every unsubscribe link already in someone's
        # inbox stop working, which for bulk email is a compliance problem, not an
        # inconvenience. Changing it deliberately is fine; changing it by accident is not.
        JWT_SECRET: '{{resolve:secretsmanager:autoreach/jwt-secret:SecretString:secret}}'
        META_APP_SECRET: !Ref MetaAppSecret
        PHONE_LOOKUP_TABLE: !Ref PhoneLookupTable
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"
      AllowCredentials: false

Parameters:
  MetaAccessToken:
    Type: String
    NoEcho: true
  WebhookVerifyToken:
    Type: String
    NoEcho: true
  MetaAppSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Meta App Secret used to verify X-Hub-Signature-256 on incoming webhooks. Optional (fail-open) — leave empty until provisioned, verification is enforced once set."
  EnvName:
    Type: String
    Default: "dev"
    Description: "Environment name (hardik/navin)"
  MentorName:
    Type: String
    Default: "Hardik Raja"
    Description: "Displayed as the mentor_name template param in workshop re-engagement messages for this account"
  SesFromEmail:
    Type: String
    Default: "otp@hardikraja.com"
    Description: "SES verified sender email for OTP"
  MetaAppId:
    Type: String
    Default: ""
    Description: "Meta App ID for resumable uploads"
  ReminderFromEmail:
    Type: String
    Default: ""
    Description: "SES sender for workshop reminder emails (domain must be verified in this account)"
  LinkBaseUrl:
    Type: String
    Default: ""
    Description: "Short-link domain mapped to this API — used to build unsubscribe URLs"
  SesSendRate:
    Type: String
    Default: "12"
    Description: "Emails/sec one email worker sends. Must stay under this account's SES rate limit — the worker is capped to one concurrent invocation, so this IS the account-wide send rate"

Resources:
  # --- Lambda Layer ---
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "autoreach-deps-${EnvName}"
      ContentUri: layers/dependencies/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: nodejs22.x

  # --- DynamoDB Tables ---
  BusinessesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: autoreach-businesses
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  CampaignsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: autoreach-campaigns
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Sparse index — only campaigns created by current-batch-scheduler.ts
        # set GSI3PK (deterministic "CURRENTBATCH#<wsCode>#<dateYMD>#<runKey>"
        # key), so this stays empty for every campaign made any other way.
        # Exists purely so that unattended nightly job can check "have I
        # already created this batch's run key?" in one indexed Query instead
        # of a full table Scan.
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: autoreach-messages
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
        - AttributeName: GSI4PK
          AttributeType: S
        - AttributeName: GSI4SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI4
          KeySchema:
            - AttributeName: GSI4PK
              KeyType: HASH
            - AttributeName: GSI4SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: autoreach-templates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  OTPTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-otp-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  FlowsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-flows-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  FlowInstancesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-flow-instances-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-conversations-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PhoneLookupTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-phone-lookup-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH

  BillingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-billing-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: month
          AttributeType: S
      KeySchema:
        - AttributeName: month
          KeyType: HASH

  EmailTemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-email-templates-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: runKey
          AttributeType: S
      KeySchema:
        - AttributeName: runKey
          KeyType: HASH

  # Standalone email templates, picked explicitly per campaign rather than
  # matched by run key. Separate table because the key changed from runKey to
  # templateId, which DynamoDB cannot alter in place.
  EmailLibraryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-email-library-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: templateId
          AttributeType: S
      KeySchema:
        - AttributeName: templateId
          KeyType: HASH

  # Addresses that must never be emailed again: unsubscribes, hard bounces and
  # spam complaints. Keyed by email rather than phone, so deliberately separate
  # from the WhatsApp stop list.
  EmailSuppressionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "autoreach-email-suppression-${EnvName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  # --- SQS ---
  EmailQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "autoreach-email-${EnvName}"
      # Long, because the worker paces itself to the SES send rate and a batch
      # of 100 can legitimately take over a minute.
      VisibilityTimeout: 960
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EmailDLQ.Arn
        maxReceiveCount: 2

  EmailDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "autoreach-email-dlq-${EnvName}"
      MessageRetentionPeriod: 1209600

  # SES publishes bounces and complaints here; suppressing those fast is what
  # keeps the sending identity (and therefore OTP login email) alive.
  SesNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "autoreach-ses-notifications-${EnvName}"

  SendQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "autoreach-send-${EnvName}.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 360
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SendDLQ.Arn
        maxReceiveCount: 2

  SendDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "autoreach-send-dlq-${EnvName}.fifo"
      FifoQueue: true
      MessageRetentionPeriod: 604800

  WebhookQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "autoreach-webhook-${EnvName}"
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WebhookDLQ.Arn
        maxReceiveCount: 3

  WebhookDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "autoreach-webhook-dlq-${EnvName}"
      MessageRetentionPeriod: 604800

  # --- S3 ---
  CSVBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "autoreach-csv-${EnvName}-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          # Scoped to the CSV prefixes ON PURPOSE. This used to be a single
          # prefix-less rule expiring the WHOLE bucket at 30 days, which also
          # caught images/ — and a template header image is referenced by
          # workshop config and by scheduled campaigns long after it's uploaded,
          # so images silently vanished out from under them. Meta then couldn't
          # fetch the URL and every send failed with 131053 (media upload
          # error); one navin batch lost ~2,500 messages that way on 15 Sep.
          # Contact CSVs really are throwaway working files, so they still go.
          - Id: AutoDeleteUploads30Days
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 30
          - Id: AutoDeleteRetryFailed30Days
            Status: Enabled
            Prefix: retry-failed/
            ExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT]
            AllowedOrigins:
              - "https://autoreach.hardikraja.com"
              - "https://autoreach.navinparmar.in"
              - "http://localhost:3000"
            ExposedHeaders: [ETag]
            MaxAge: 300

  CSVBucketCDN:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt CSVBucket.RegionalDomainName
            OriginAccessControlId: !Ref CSVBucketOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
          Compress: true
          DefaultTTL: 86400
        PriceClass: PriceClass_100

  CSVBucketOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "autoreach-csv-oac-${EnvName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CSVBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CSVBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${CSVBucket.Arn}/images/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CSVBucketCDN}"

  # --- IAM Role for EventBridge Scheduler ---
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "autoreach-scheduler-role-${EnvName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSendLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SendCampaignFunction.Arn

  # --- Lambda Functions ---
  RequestOTPFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/auth/request-otp.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OTPTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/request-otp
            Method: POST

  VerifyOTPFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/auth/verify-otp.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OTPTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/verify-otp
            Method: POST

  ListBusinessesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/list.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /businesses
            Method: GET

  CreateBusinessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PhoneLookupTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /businesses
            Method: POST

  UpdateBusinessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/update.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PhoneLookupTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /businesses/{businessId}
            Method: PUT

  SubscribeWebhooksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/subscribe-webhooks.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /businesses/subscribe-webhooks
            Method: POST

  RegisterNumberFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/register-number.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /businesses/register-number
            Method: POST

  QualityCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/quality-check.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /businesses/quality-check
            Method: POST

  WhatsAppSpendFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/businesses/whatsapp-spend.handler
      # API Gateway REST APIs hard-kill the connection at 29s regardless of
      # this value — keep it just under that so the Lambda returns a real
      # error response instead of API Gateway returning a bare 502.
      Timeout: 28
      Environment:
        Variables:
          # Lets a machine read this one endpoint without an inbox to receive an OTP in:
          # the accounting stack pulls the month's WhatsApp bill nightly. Deliberately not
          # JWT_SECRET - that value is also the Meta webhook verify token, so handing it
          # out to sign tokens with would put webhook verification in a second place too.
          #
          # Resolved from Secrets Manager at deploy time, so the key is never in this repo.
          # Create it once per account before deploying:
          #   aws secretsmanager create-secret --name autoreach/service-api-key --secret-string '{"apiKey":"<generate one>"}'
          # Absent or empty, no service caller is allowed - it never means "allow anyone".
          SERVICE_API_KEY: '{{resolve:secretsmanager:autoreach/service-api-key:SecretString:apiKey}}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /businesses/whatsapp-spend
            Method: GET

  CreateCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
              Resource:
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/autoreach-${EnvName}/*"
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
      Environment:
        Variables:
          SEND_FUNCTION_ARN: !GetAtt SendCampaignFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
          SCHEDULER_GROUP: !Sub "autoreach-${EnvName}"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns
            Method: POST

  UpdateCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/update.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
              Resource:
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/autoreach-${EnvName}/*"
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
      Environment:
        Variables:
          SEND_FUNCTION_ARN: !GetAtt SendCampaignFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
          SCHEDULER_GROUP: !Sub "autoreach-${EnvName}"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/{campaignId}
            Method: PUT

  BulkApproveCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/bulk-approve.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
              Resource:
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/autoreach-${EnvName}/*"
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
      Environment:
        Variables:
          SEND_FUNCTION_ARN: !GetAtt SendCampaignFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
          SCHEDULER_GROUP: !Sub "autoreach-${EnvName}"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/bulk-approve
            Method: POST

  DeleteCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/delete.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /campaigns/{campaignId}
            Method: DELETE

  BulkDeleteCampaignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/campaigns/bulk-delete.handler
      Timeout: 30
      Environment:
        Variables:
          SCHEDULER_GROUP: !Sub "autoreach-${EnvName}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampaignsTable
        - Version: "2012-10-17"
          Statement:
